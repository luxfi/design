<style>body{margin:0;padding:20px;background:#000;font-family:var(--font-sans)}pre{margin:0;padding:16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);font-size:12px;line-height:1.7;color:var(--neutral-300);overflow:auto}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const { Tabs, TabsList, TabsTrigger, TabsContent, Accordion, AccordionItem } = window.LuxDesignSystem_0a9445;
const TS = "import Lux from '@lux/cloud'\n\nconst lux = new Lux()\nawait lux.chat.completions.create({\n  model: 'lux-pro',\n  messages: [{ role: 'user', content: 'Hi' }],\n})";
const PY = "from lux import Lux\n\nlux = Lux()\nlux.chat.completions.create(\n    model=\"lux-pro\",\n    messages=[{\"role\": \"user\", \"content\": \"Hi\"}],\n)";
const SH = "curl https://api.lux.network/v1/chat/completions \\\n  -H \"Authorization: Bearer $LUX_API_KEY\" \\\n  -d '{\"model\":\"lux-pro\"}'";
function Demo(){
  return (<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24}}>
    <Tabs defaultValue="ts">
      <TabsList><TabsTrigger value="ts">TypeScript</TabsTrigger><TabsTrigger value="py">Python</TabsTrigger><TabsTrigger value="sh">cURL</TabsTrigger></TabsList>
      <TabsContent value="ts"><pre>{TS}</pre></TabsContent>
      <TabsContent value="py"><pre>{PY}</pre></TabsContent>
      <TabsContent value="sh"><pre>{SH}</pre></TabsContent>
    </Tabs>
    <Accordion defaultValue="q1">
      <AccordionItem value="q1" title="How is usage billed?">Per token, metered hourly. You pay only for what you use.</AccordionItem>
      <AccordionItem value="q2" title="Can I self-host?">Yes. Every service in the Lux cloud is open source.</AccordionItem>
      <AccordionItem value="q3" title="Which models are available?">Zen open weights, plus Lux Flash, Pro, and Ultra.</AccordionItem>
    </Accordion>
  </div>)
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
